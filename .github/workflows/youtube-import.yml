# YouTube Video Import → blog post (fully automated)
#
# Runs on a schedule in the cloud. For each new video it:
#   1. Creates a post (video embed + transcript-derived body).
#   2. Writes a meaningful TL;DR with Claude.
#   3. Auto-publishes the post (contentStatus = "published"), which fires the
#      Sanity webhook → deploy → the post goes live.
#
# Transcripts are fetched via Supadata (SUPADATA_API_KEY), because YouTube blocks
# transcript requests from GitHub's datacenter IPs. Posts without an available
# transcript are left as drafts (never auto-published) and retried next run.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
# - SANITY_WRITE_TOKEN            Editor-role token from sanity.io/manage
# - YOUTUBE_CHANNEL_ID            your channel ID (starts with UC…)
# - NEXT_PUBLIC_SANITY_PROJECT_ID
# - NEXT_PUBLIC_SANITY_DATASET    (optional; defaults to "production")
# - SUPADATA_API_KEY             https://supadata.ai  (free tier: 100/month)
# - ANTHROPIC_API_KEY            https://console.anthropic.com  (Claude)
# - ANTHROPIC_MODEL              (optional; defaults to claude-haiku-4-5)
#
# You can also trigger it by hand from the Actions tab (workflow_dispatch).

name: YouTube Import

on:
  schedule:
    # Daily at 8:00 AM UTC (10:00 AM CEST in summer).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import new YouTube videos
        run: npx tsx scripts/import-youtube-video.ts

      - name: Generate TL;DRs and publish
        run: npx tsx scripts/generate-tldrs.ts --auto-publish
