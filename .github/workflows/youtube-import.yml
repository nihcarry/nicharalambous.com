# YouTube Video Import
#
# Manual trigger only. YouTube blocks transcript fetches from GitHub Actions
# datacenter IPs, so running this in CI produced posts with no transcript
# (video + description only). Run the import LOCALLY instead, where transcripts
# succeed:
#
#   npm run import:youtube            # import new videos (video + transcript)
#   npm run import:youtube:dry-run    # preview without writing
#
# This workflow is kept for emergencies (video + description fallback only).
#
# Required GitHub Secrets:
# - SANITY_WRITE_TOKEN (Editor role token)
# - YOUTUBE_CHANNEL_ID (your channel ID)
# - NEXT_PUBLIC_SANITY_PROJECT_ID
# - NEXT_PUBLIC_SANITY_DATASET

name: YouTube Import

on:
  # Scheduled runs disabled: transcripts can't be fetched from CI IPs.
  # Run locally via `npm run import:youtube`. Manual dispatch kept as a fallback.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import YouTube videos
        run: npx tsx scripts/import-youtube-video.ts
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
